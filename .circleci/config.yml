version: 2.1

# Rebuilds pinned engine submodules, roadmap, types, tests and UI artifacts.
jobs:
  application-policy:
    docker:
      - image: cimg/node:24.21.0
    resource_class: large
    steps:
      - checkout
      - run:
          name: Checkout exact pinned audit-engine submodules
          command: git submodule update --init --recursive
      - run: npm run check:roadmap
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run: python3 scripts/validate_e2eesa_status.py

workflows:
  full-ci:
    jobs:
      - application-policy
      - security-status-record
